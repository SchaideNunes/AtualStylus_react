version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atualestilo_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=atual_user
      - DB_PASSWORD=atual_password
      - DB_NAME=atualestilo_db
      - JWT_SECRET=chave_secreta_jwt_para_docker_123456
      - JWT_EXPIRES_IN=7d
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atual_network

  db:
    image: mysql:8.0
    container_name: atualestilo_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: atualestilo_db
      MYSQL_USER: atual_user
      MYSQL_PASSWORD: atual_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "atual_user", "-patual_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atual_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: atualestilo_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password_segura
    depends_on:
      - db
    networks:
      - atual_network

volumes:
  mysql_data:

networks:
  atual_network:
    driver: bridge
